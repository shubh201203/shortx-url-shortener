services:
  - type: web
    name: shortx-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python ml_model/train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_NAME
        value: url_shortener
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
